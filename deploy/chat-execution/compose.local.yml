name: saas-chat-execution-local
services:
  postgres:
    image: postgres:17.6
    command: postgres -c max_connections=120
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: local-hatchet-only
      POSTGRES_DB: hatchet
    volumes:
      - hatchet_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -d hatchet -U hatchet]
      interval: 3s
      timeout: 3s
      retries: 20
  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.5
    ports:
      - 127.0.0.1:8890:8888
      - 127.0.0.1:7077:7077
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hatchet:local-hatchet-only@postgres:5432/hatchet?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8890
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    volumes:
      - hatchet_config:/config
volumes:
  hatchet_db:
  hatchet_config:
