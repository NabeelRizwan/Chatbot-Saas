version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: chatbot-saas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chatbot_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatbot-saas-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: chatbot-saas-object-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development-access
      MINIO_ROOT_PASSWORD: local-development-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 local-development-access local-development-secret-change-me; do sleep 2; done &&
      mc mb --ignore-existing local/chatbot-knowledge"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-saas-backend
    command: python scripts/start_api.py
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/chatbot_saas
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_MODE: arq
      ARQ_QUEUE_NAME: ingestion
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: chatbot-knowledge
      OBJECT_STORAGE_ACCESS_KEY_ID: local-development-access
      OBJECT_STORAGE_SECRET_ACCESS_KEY: local-development-secret-change-me
      OBJECT_STORAGE_REGION: us-east-1
      ALLOW_DETERMINISTIC_EMBEDDING_FALLBACK: "false"
      PUBLIC_DIRECT_API_ENABLED: "false"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-saas-worker
    command: python scripts/start_worker.py
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/chatbot_saas
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_MODE: arq
      ARQ_QUEUE_NAME: ingestion
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: chatbot-knowledge
      OBJECT_STORAGE_ACCESS_KEY_ID: local-development-access
      OBJECT_STORAGE_SECRET_ACCESS_KEY: local-development-secret-change-me
      OBJECT_STORAGE_REGION: us-east-1
      ALLOW_DETERMINISTIC_EMBEDDING_FALLBACK: "false"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: chatbot-saas-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
